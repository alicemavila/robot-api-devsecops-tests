openapi: 3.0.3

info:
  title: ReqRes API Contract
  version: 1.1.0
  description: OpenAPI contract used for automated API contract testing in a QA portfolio project.

servers:
  - url: https://reqres.in/api

components:
  securitySchemes:
    ReqResApiKey:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    Metadata:
      type: object
      additionalProperties: true

    Support:
      type: object
      required:
        - url
        - text
      properties:
        url:
          type: string
          format: uri
        text:
          type: string
      additionalProperties: true

    User:
      type: object
      required:
        - id
        - email
        - first_name
        - last_name
        - avatar
      properties:
        id:
          type: integer
          example: 2
        email:
          type: string
          format: email
          example: janet.weaver@reqres.in
        first_name:
          type: string
          example: Janet
        last_name:
          type: string
          example: Weaver
        avatar:
          type: string
          format: uri
      additionalProperties: true

    SingleUserResponse:
      type: object
      required:
        - data
        - support
      properties:
        data:
          $ref: '#/components/schemas/User'
        support:
          $ref: '#/components/schemas/Support'
        _meta:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: true

    UsersListResponse:
      type: object
      required:
        - page
        - per_page
        - total
        - total_pages
        - data
        - support
      properties:
        page:
          type: integer
          example: 2
        per_page:
          type: integer
          example: 6
        total:
          type: integer
          example: 12
        total_pages:
          type: integer
          example: 2
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        support:
          $ref: '#/components/schemas/Support'
        _meta:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: true

    CreateUserRequest:
      type: object
      required:
        - name
        - job
      properties:
        name:
          type: string
          example: Alice QA
        job:
          type: string
          example: QA Engineer
      additionalProperties: false

    CreateUserResponse:
      type: object
      required:
        - name
        - job
        - id
        - createdAt
      properties:
        name:
          type: string
          example: Alice QA
        job:
          type: string
          example: QA Engineer
        id:
          type: string
          example: '123'
        createdAt:
          type: string
          format: date-time
      additionalProperties: true

    UpdateUserRequest:
      type: object
      required:
        - name
        - job
      properties:
        name:
          type: string
          example: Alice QA Updated
        job:
          type: string
          example: Senior QA Engineer
      additionalProperties: false

    UpdateUserResponse:
      type: object
      required:
        - name
        - job
        - updatedAt
      properties:
        name:
          type: string
          example: Alice QA Updated
        job:
          type: string
          example: Senior QA Engineer
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: eve.holt@reqres.in
        password:
          type: string
          example: cityslicka
      additionalProperties: false

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: eve.holt@reqres.in
        password:
          type: string
          example: pistol
      additionalProperties: false

    LoginSuccessResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: QpwL5tke4Pnpja7X4
      additionalProperties: true

    RegisterSuccessResponse:
      type: object
      required:
        - id
        - token
      properties:
        id:
          type: integer
          example: 4
        token:
          type: string
          example: QpwL5tke4Pnpja7X4
      additionalProperties: true

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Missing password
      additionalProperties: true

paths:
  /users:
    get:
      tags:
        - Users
      summary: Get users list
      operationId: getUsersList
      security:
        - ReqResApiKey: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            example: 2
      responses:
        '200':
          description: Users list returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'

    post:
      tags:
        - Users
      summary: Create user
      operationId: createUser
      security:
        - ReqResApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      operationId: getUserById
      security:
        - ReqResApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            enum:
              - 2
            example: 2
      responses:
        '200':
          description: Existing user found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleUserResponse'
        '404':
          description: User not found

    put:
      tags:
        - Users
      summary: Update user
      operationId: updateUser
      security:
        - ReqResApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            enum:
              - 2
            example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'

    delete:
      tags:
        - Users
      summary: Delete user
      operationId: deleteUser
      security:
        - ReqResApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            enum:
              - 2
            example: 2
      responses:
        '204':
          description: User deleted successfully

  /login:
    post:
      tags:
        - Authentication
      summary: Login successfully
      operationId: loginSuccessfully
      security:
        - ReqResApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login performed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: Invalid login payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /register:
    post:
      tags:
        - Authentication
      summary: Register successfully
      operationId: registerSuccessfully
      security:
        - ReqResApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Register performed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
        '400':
          description: Invalid register payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'